plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/affogatotweaks.accesswidener")
}

repositories {
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.wispforest.io" }
    maven { url = "https://maven.fzzyhmstrs.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.gegy.dev/releases/" }
    maven { url = "https://jitpack.io" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(implementation("com.moulberry:mixinconstraints:${project.mixinconstraints_version}"))
    modImplementation(include("com.github.ramixin:mixson-fabric:${project.mixson_version}")) {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api"
    }
    modImplementation(include("maven.modrinth:custombrewrecipes:1.3.2"))
    modImplementation "dev.emi:emi-fabric:1.1.22+1.21.1"
    modImplementation "com.terraformersmc:modmenu:11.0.3"

    modImplementation "maven.modrinth:clifftree:2.0.1+mod"
    modImplementation "maven.modrinth:farmers-delight-refabricated:1.21.1-3.2.0"
    modImplementation "maven.modrinth:inmis:2.8.1-1.21.1"
    modImplementation "maven.modrinth:appleskin:3.0.6+mc1.21"
    modImplementation "maven.modrinth:mouse-tweaks:1.21-2.26-fabric"
    modImplementation "maven.modrinth:notes:1.21-2.1.1-fabric"
    modImplementation "maven.modrinth:eating-animation:1.9.72"
    modImplementation "maven.modrinth:auroraslanterns:1.1.7+1.21.1"
    modImplementation "dev.yumi.mc.core:yumi-mc-foundation:1.0.0-alpha.16+1.21.1"
    modCompileOnly "maven.modrinth:serene-seasons:10.1.0.1-fabric,1.21.1"
    modCompileOnly "maven.modrinth:glitchcore:2.1.0.0-fabric,1.21.1"
    modRuntimeOnly("com.github.Chocohead:Fabric-ASM:v2.3") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api"
    }
    modRuntimeOnly "maven.modrinth:cloth-config:15.0.140+fabric"
    modRuntimeOnly "me.fzzyhmstrs:fzzy_config:0.7.1+1.21"
    modRuntimeOnly "net.fabricmc:fabric-language-kotlin:1.13.4+kotlin.2.2.0"
    modRuntimeOnly "maven.modrinth:jade:15.10.2+fabric"
    modRuntimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
    modRuntimeOnly "maven.modrinth:aileron:1.21.1-fabric-1.1.3"
    modRuntimeOnly "maven.modrinth:midnightlib:1.7.5+1.21.1-fabric"
    modRuntimeOnly "maven.modrinth:repurposed-structures-fabric:7.5.17+1.21.1-fabric"
    modRuntimeOnly "maven.modrinth:worldedit:7.3.8"
    modRuntimeOnly "maven.modrinth:extrasoundsforge:1.4-fabric,1.21.1"
    modRuntimeOnly "maven.modrinth:chalk:2.2.5+1.21.1"
    modRuntimeOnly "maven.modrinth:rearm:2.3.5+1.21.1-fabric"
    modRuntimeOnly "com.github.MCLegoMan:releasetypeutils:2.1.0"
    modRuntimeOnly "com.github.MCLegoMan:fabric-simplelibs:2.0.0-Fabric"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}